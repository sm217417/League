<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WINNER">
<title>WINNER PRO</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{font-size:15px;-webkit-tap-highlight-color:transparent;}
body{font-family:"Hiragino Sans","Meiryo",sans-serif;background:#f5f7fa;color:#1a2333;min-height:100vh;padding-bottom:68px;}
:root{
  --g:#00a854;--g2:#e8f5ee;
  --red:#e53935;--red2:#fdecea;
  --gold:#f5a623;--gold2:#fff8e1;
  --bg:#f5f7fa;--white:#fff;
  --border:#dde3ed;--muted:#6b7c93;
  --d1:#f5a623;--d2:#00a854;--d3:#0288d1;
}
/* ボトムナビ */
.bnav{position:fixed;bottom:0;left:0;right:0;z-index:100;background:#fff;border-top:1px solid var(--border);display:flex;height:58px;}
.bnav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;color:var(--muted);font-size:10px;border:none;background:none;padding:4px 0;}
.bnav-btn.active{color:var(--g);}
.bnav-icon{font-size:19px;line-height:1;}
/* ページ */
.page{display:none;}
.page.active{display:block;}
/* ヘッダー */
.phdr{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--border);padding:11px 14px 9px;}
.ptitle{font-size:17px;font-weight:700;}
/* カード */
.card{background:#fff;border:1px solid var(--border);border-radius:10px;margin:10px 12px;overflow:hidden;}
.card-hdr{padding:11px 13px;font-size:13px;font-weight:700;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.card-body{padding:12px 13px;}
/* タブ */
.tabs{display:flex;gap:6px;padding:9px 12px;overflow-x:auto;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex-shrink:0;padding:6px 13px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;border:1px solid var(--border);background:#fff;color:var(--muted);transition:all .15s;}
.tab.active{background:var(--g);color:#fff;border-color:var(--g);}
/* フォーム */
.field{margin-bottom:10px;}
.field label{display:block;font-size:11px;color:var(--muted);font-weight:700;margin-bottom:4px;}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;background:#fff;outline:none;-webkit-appearance:none;}
input:focus,select:focus,textarea:focus{border-color:var(--g);}
textarea{resize:vertical;min-height:80px;line-height:1.7;}
.row{display:flex;gap:8px;}
.row input,.row select{flex:1;}
/* ボタン */
.btn{display:inline-flex;align-items:center;justify-content:center;padding:9px 16px;border-radius:8px;font-size:13px;font-weight:700;border:none;cursor:pointer;font-family:inherit;transition:all .12s;}
.btn-g{background:var(--g);color:#fff;}
.btn-g:active{background:#007a3d;}
.btn-sub{background:var(--bg);color:var(--muted);border:1px solid var(--border);}
.btn-sub:active{background:var(--border);}
.btn-sm{padding:6px 12px;font-size:12px;}
.btn-full{width:100%;}
/* 順位表 */
.stbl{width:100%;border-collapse:collapse;font-size:13px;}
.stbl th{padding:8px 5px;text-align:center;font-size:11px;font-weight:700;color:var(--muted);border-bottom:2px solid var(--border);white-space:nowrap;}
.stbl th:nth-child(2){text-align:left;}
.stbl td{padding:9px 5px;text-align:center;border-bottom:1px solid #f0f2f5;}
.stbl td:nth-child(2){text-align:left;font-weight:700;}
.stbl tr:last-child td{border-bottom:none;}
.row-p{background:var(--g2);}
.row-r{background:var(--red2);}
.pts{font-size:15px;font-weight:700;color:var(--g);}
.rn{font-weight:700;font-size:14px;}
.r1{color:var(--gold)}.r2{color:#90a4ae}.r3{color:#ff8a65}
/* プログレス */
.prog{padding:8px 13px;}
.prog-bar{height:4px;background:#eee;border-radius:2px;overflow:hidden;}
.prog-fill{height:100%;border-radius:2px;transition:width .4s;}
.prog-txt{font-size:11px;color:var(--muted);text-align:right;margin-top:3px;}
/* 試合 */
.mcard{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;padding:11px 13px;border-bottom:1px solid #f0f2f5;}
.mcard:last-child{border-bottom:none;}
.mteam{font-size:13px;font-weight:700;}
.mteam.home{text-align:right;}
.mcenter{display:flex;flex-direction:column;align-items:center;gap:5px;}
.srow{display:flex;align-items:center;gap:5px;}
.sinp{width:42px;height:38px;text-align:center;font-size:19px;font-weight:700;border:1px solid var(--border);border-radius:7px;background:var(--bg);}
.sinp:focus{border-color:var(--g);background:#fff;}
.ssep{font-size:17px;color:var(--muted);font-weight:700;}
.sbtn{font-size:11px;padding:4px 9px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--muted);cursor:pointer;font-family:inherit;font-weight:700;}
.sbtn.saved{border-color:var(--g);color:var(--g);background:var(--g2);}
.rlbl{padding:7px 13px 3px;font-size:11px;font-weight:700;color:var(--muted);background:var(--bg);border-bottom:1px solid var(--border);}
/* H2H */
.h2h-sum{display:grid;grid-template-columns:1fr 1fr 1fr;text-align:center;padding:14px;}
.h2h-val{font-size:27px;font-weight:700;line-height:1;}
.h2h-lbl{font-size:11px;color:var(--muted);margin-top:3px;}
/* チームフィルター */
.tfilter{display:flex;flex-wrap:wrap;gap:6px;padding:10px 13px;}
.tchip{display:inline-flex;align-items:center;padding:4px 10px;border-radius:20px;font-size:12px;border:1px solid var(--border);background:#fff;cursor:pointer;font-family:inherit;}
.tchip.on{color:#fff;border-color:transparent;}
/* セクションラベル */
.slbl{font-size:11px;font-weight:700;color:var(--muted);padding:10px 13px 3px;}
/* ローディング */
.loading{text-align:center;padding:28px;color:var(--muted);font-size:13px;}
/* チャート */
.chart-wrap{overflow-x:auto;padding:10px 13px;}
canvas{display:block;max-width:100%;}
/* PO */
.po-match{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:8px;overflow:hidden;margin:4px 0;}
.po-team{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border-bottom:1px solid var(--border);font-size:13px;font-weight:700;}
.po-team:last-child{border-bottom:none;}
.po-team.winner{background:var(--g2);color:var(--g);}
.po-team.loser{color:var(--muted);}
.po-sinp{width:40px;height:34px;text-align:center;font-size:17px;font-weight:700;border:1px solid var(--border);border-radius:6px;background:var(--bg);}
/* レスポンシブ */
@media(min-width:600px){body{max-width:660px;margin:0 auto;}.bnav{max-width:660px;left:50%;transform:translateX(-50%);}}
</style>
</head>
<body>

<!-- 順位表 -->
<div class="page active" id="pg-home">
  <div class="phdr">
    <div style="display:flex;align-items:center;justify-content:space-between;">
      <div class="ptitle">📊 順位表</div>
      <select id="home-yr" style="width:100px;font-size:13px;padding:5px 8px;" onchange="loadStandings()"></select>
    </div>
  </div>
  <div class="tabs" id="dtabs-home"></div>
  <div id="standings-area"><div class="loading">データなし</div></div>
</div>

<!-- 試合 -->
<div class="page" id="pg-matches">
  <div class="phdr">
    <div class="ptitle">⚽ 試合入力</div>
    <div style="display:flex;gap:6px;margin-top:7px;flex-wrap:wrap;">
      <select id="m-yr" style="font-size:12px;padding:5px 8px;" onchange="loadMatches()"></select>
      <select id="m-round" style="font-size:12px;padding:5px 8px;" onchange="renderMatches()"><option value="all">全節</option></select>
      <select id="m-status" style="font-size:12px;padding:5px 8px;" onchange="renderMatches()">
        <option value="all">全試合</option><option value="pending">未入力</option><option value="done">入力済</option>
      </select>
    </div>
  </div>
  <div class="tabs" id="dtabs-matches"></div>
  <div id="matches-area"><div class="loading">データなし</div></div>
</div>

<!-- 設定 -->
<div class="page" id="pg-setup">
  <div class="phdr"><div class="ptitle">⚙️ 設定</div></div>
  <div class="card">
    <div class="card-hdr">📅 シーズン</div>
    <div class="card-body">
      <div class="field"><label>年度</label><input type="number" id="s-yr" placeholder="例: 2025"></div>
      <div class="field"><label>昇格枠 / 降格枠</label>
        <div class="row"><input type="number" id="s-pn" value="1" min="0"><input type="number" id="s-rn" value="1" min="0"></div>
      </div>
    </div>
  </div>
  <div id="setup-divs"></div>
  <div class="card">
    <div class="card-hdr">🏷️ リーグ名</div>
    <div class="card-body" id="dname-area"></div>
  </div>

  <div class="card">
    <div class="card-hdr">📂 過去データの読み込み</div>
    <div class="card-body">
      <p style="font-size:12px;color:var(--muted);margin-bottom:10px;line-height:1.6;">
        過去のシーズン順位データをJSON形式で貼り付けると歴代タブに反映されます。<br>
        既存のデータは上書きされません（追記されます）。
      </p>
      <div class="field">
        <label>JSONを貼り付け</label>
        <textarea id="import-json" placeholder='[
  {
    "year": 2020,
    "div": 1,
    "standings": [
      {"rank": 1, "team": "FC東京"},
      {"rank": 2, "team": "浦和レッズ"}
    ]
  }
]' style="min-height:140px;font-size:12px;font-family:monospace;"></textarea>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-g btn-sm" onclick="importPastData()">✚ 読み込む</button>
        <button class="btn btn-sub btn-sm" onclick="exportCurrentData()">📤 現在のデータを書き出す</button>
      </div>
      <div id="import-msg" style="font-size:12px;margin-top:8px;"></div>
    </div>
  </div>
</div>

<!-- 対戦成績 -->
<div class="page" id="pg-h2h">
  <div class="phdr">
    <div class="ptitle">🆚 対戦成績</div>
    <div style="display:flex;gap:6px;align-items:center;margin-top:7px;">
      <select id="h2h-a" style="flex:1;font-size:13px;padding:6px 8px;"></select>
      <span style="color:var(--muted);font-weight:700;font-size:13px;">VS</span>
      <select id="h2h-b" style="flex:1;font-size:13px;padding:6px 8px;"></select>
      <button class="btn btn-g btn-sm" onclick="showH2H()">検索</button>
    </div>
  </div>
  <div id="h2h-area"></div>
</div>

<!-- 昇降格 -->
<div class="page" id="pg-promo">
  <div class="phdr">
    <div class="ptitle">🔼 昇降格</div>
    <div style="display:flex;gap:6px;align-items:center;margin-top:7px;flex-wrap:wrap;">
      <select id="p-from" style="font-size:13px;padding:6px 8px;" onchange="renderPromoPreview()"></select>
      <span style="color:var(--muted);">→</span>
      <select id="p-to" style="font-size:13px;padding:6px 8px;"></select>
      <button class="btn btn-g btn-sm" onclick="execPromo()">実行</button>
    </div>
  </div>
  <div class="card">
    <div class="card-hdr">枠数設定</div>
    <div class="card-body">
      <table style="width:100%;font-size:12px;border-collapse:collapse;">
        <tr><th></th><th style="color:var(--d1);text-align:center;padding:4px;">1部</th><th style="color:var(--d2);text-align:center;padding:4px;">2部</th><th style="color:var(--d3);text-align:center;padding:4px;">3部</th></tr>
        <tr>
          <td style="color:var(--g);font-size:12px;padding:4px;">🔼昇格</td>
          <td style="padding:4px;text-align:center;"><input type="number" id="pn1" value="0" disabled style="width:44px;padding:4px;text-align:center;background:#f0f2f5;"></td>
          <td style="padding:4px;text-align:center;"><input type="number" id="pn2" value="1" min="0" style="width:44px;padding:4px;text-align:center;"></td>
          <td style="padding:4px;text-align:center;"><input type="number" id="pn3" value="1" min="0" style="width:44px;padding:4px;text-align:center;"></td>
        </tr>
        <tr>
          <td style="color:var(--red);font-size:12px;padding:4px;">🔽降格</td>
          <td style="padding:4px;text-align:center;"><input type="number" id="rn1" value="1" min="0" style="width:44px;padding:4px;text-align:center;"></td>
          <td style="padding:4px;text-align:center;"><input type="number" id="rn2" value="1" min="0" style="width:44px;padding:4px;text-align:center;"></td>
          <td style="padding:4px;text-align:center;"><input type="number" id="rn3" value="0" disabled style="width:44px;padding:4px;text-align:center;background:#f0f2f5;"></td>
        </tr>
      </table>
      <button class="btn btn-sub btn-sm" style="margin-top:8px;" onclick="renderPromoPreview()">プレビュー更新</button>
    </div>
  </div>
  <div id="promo-area"></div>
</div>

<!-- 歴代・変動 -->
<div class="page" id="pg-history">
  <div class="phdr">
    <div class="ptitle">📈 歴代・変動</div>
    <div class="tabs" style="padding:7px 0 0;margin:0;">
      <div class="tab active" onclick="switchHistTab('alltime',this)">🏆 歴代</div>
      <div class="tab" onclick="switchHistTab('trend',this)">📊 年度別</div>
      <div class="tab" onclick="switchHistTab('inseason',this)">🔄 シーズン内</div>
    </div>
  </div>
  <div id="history-area"></div>
</div>

<!-- 昇格PO -->
<div class="page" id="pg-playoff">
  <div class="phdr">
    <div class="ptitle">🏆 昇格プレーオフ</div>
    <div style="display:flex;gap:6px;margin-top:7px;">
      <select id="po-yr" style="font-size:13px;padding:6px 8px;" onchange="renderPlayoff()"></select>
    </div>
  </div>
  <div class="tabs" id="dtabs-po"></div>
  <div id="playoff-area"></div>
</div>

<!-- ボトムナビ -->
<nav class="bnav">
  <button class="bnav-btn active" onclick="go('home',this)"><span class="bnav-icon">📊</span>順位表</button>
  <button class="bnav-btn" onclick="go('matches',this)"><span class="bnav-icon">⚽</span>試合</button>
  <button class="bnav-btn" onclick="go('setup',this)"><span class="bnav-icon">⚙️</span>設定</button>
  <button class="bnav-btn" onclick="go('h2h',this)"><span class="bnav-icon">🆚</span>対戦</button>
  <button class="bnav-btn" onclick="go('promo',this)"><span class="bnav-icon">🔼</span>昇降格</button>
  <button class="bnav-btn" onclick="go('history',this)"><span class="bnav-icon">📈</span>歴代</button>
  <button class="bnav-btn" onclick="go('playoff',this)"><span class="bnav-icon">🏆</span>PO</button>
</nav>

<script>
// ══ DB (localStorage) ══
const KEY = 'winner-final-v1';
function load(){ try{ return JSON.parse(localStorage.getItem(KEY))||init_db(); }catch(e){ return init_db(); } }
function save(db){ localStorage.setItem(KEY, JSON.stringify(db)); }
function init_db(){ return { seasons:{}, teams:{}, config:{ div_names:{1:"1部リーグ",2:"2部リーグ",3:"3部リーグ"} } }; }

// ══ 状態 ══
let db = load();
let curDiv = {home:1, matches:1, po:1};
let allMatches = {};
let histTab = 'alltime';
const PAL = ["#00a854","#f5a623","#e53935","#1976d2","#8e24aa","#0097a7","#558b2f","#f57c00","#ad1457","#00838f","#4527a0","#2e7d32"];
let trendSel = new Set(), isSel = new Set();

// ══ 初期化 ══
function init(){
  const yr = new Date().getFullYear();
  document.getElementById('s-yr').value = yr;
  refreshSeasonSelects();
  buildDivTabs('dtabs-home', 1, d=>{ curDiv.home=d; loadStandings(); });
  buildDivTabs('dtabs-matches', 1, d=>{ curDiv.matches=d; loadMatches(); });
  buildDivTabs('dtabs-po', 1, d=>{ curDiv.po=d; renderPlayoff(); });
  buildSetup();
  buildDivNameForm();
  buildH2HSelects();
  loadStandings();
  loadMatches();
  renderPromoPreview();
  renderHistAlltime();
}

function refreshSeasonSelects(){
  const seasons = getSeasons();
  const opts = seasons.map(y=>`<option value="${y}">${y}年</option>`).join('');
  const empty = '<option value="">—</option>';
  ['home-yr','m-yr','p-from','p-to','po-yr'].forEach(id=>{
    const el=document.getElementById(id);
    if(el) el.innerHTML = opts||empty;
  });
}

// ══ ページ切替 ══
function go(name, btn){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.bnav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('pg-'+name).classList.add('active');
  btn.classList.add('active');
  window.scrollTo(0,0);
  if(name==='history') switchHistTab(histTab, document.querySelector('#pg-history .tab.active'));
  if(name==='playoff') renderPlayoff();
}

// ══ 部門タブ ══
function buildDivTabs(id, active, cb){
  const dn = db.config.div_names;
  document.getElementById(id).innerHTML = [1,2,3].map(d=>`
    <div class="tab ${d===active?'active':''}" data-d="${d}"
      onclick="this.parentNode.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));this.classList.add('active');(${cb.toString()})(${d})">
      ${dn[d]||d+'部'}
    </div>`).join('');
}

// ══ データアクセス ══
function getSeasons(){ return Object.keys(db.seasons).sort((a,b)=>b-a); }
function getDivData(yr,div){ return db.seasons[String(yr)]?.divisions?.[String(div)]; }
function getDivName(div){ return db.config.div_names[div]||div+'部'; }

// ══ 順位計算 ══
function calcStandings(yr,div){
  const d = getDivData(yr,div);
  if(!d) return [];
  const s={};
  d.teams.forEach(t=>s[t]={team:t,p:0,w:0,d:0,l:0,gf:0,ga:0,gd:0,pts:0});
  (d.matches||[]).forEach(m=>{
    if(!m.played) return;
    const h=m.home,a=m.away,hs=m.home_score,as_=m.away_score;
    s[h].p++;s[a].p++;s[h].gf+=hs;s[h].ga+=as_;s[a].gf+=as_;s[a].ga+=hs;
    s[h].gd=s[h].gf-s[h].ga;s[a].gd=s[a].gf-s[a].ga;
    if(hs>as_){s[h].w++;s[h].pts+=3;s[a].l++;}
    else if(hs<as_){s[a].w++;s[a].pts+=3;s[h].l++;}
    else{s[h].d++;s[h].pts++;s[a].d++;s[a].pts++;}
  });
  return Object.values(s).sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf).map((r,i)=>({...r,rank:i+1}));
}

// ══ 順位表 ══
function loadStandings(){
  const yr = document.getElementById('home-yr').value;
  const div = curDiv.home;
  if(!yr){ document.getElementById('standings-area').innerHTML='<div class="loading">年度がありません</div>'; return; }
  const rows = calcStandings(parseInt(yr), div);
  const d = getDivData(yr, div);
  const matches = d?.matches||[];
  const done = matches.filter(m=>m.played).length;
  const total = matches.length;
  const pN = d?.promoteN||1, rN = d?.relegateN||1;
  const color = ['','#f5a623','#00a854','#0288d1'][div];
  const n = rows.length;

  let html=`<div class="prog"><div class="prog-bar"><div class="prog-fill" style="width:${total?done/total*100:0}%;background:${color}"></div></div><div class="prog-txt">${done}/${total} 試合</div></div>`;
  if(!rows.length){ html+='<div class="loading">データなし</div>'; document.getElementById('standings-area').innerHTML=html; return; }
  html+=`<div class="card"><table class="stbl"><thead><tr><th>#</th><th>チーム</th><th>試</th><th>勝</th><th>分</th><th>敗</th><th>差</th><th>勝点</th></tr></thead><tbody>`;
  rows.forEach((r,i)=>{
    const isP = div!==1&&i<pN, isR = div!==3&&n-i<=rN;
    const rc = i===0?'r1':i===1?'r2':i===2?'r3':'';
    const gd = r.gd>0?'+'+r.gd:r.gd;
    const gdCol = r.gd>0?'color:var(--g)':r.gd<0?'color:var(--red)':'';
    const badge = isP?'<span style="font-size:9px;color:var(--g)">↑</span>':isR?'<span style="font-size:9px;color:var(--red)">↓</span>':'';
    html+=`<tr class="${isP?'row-p':isR?'row-r':''}"><td><span class="rn ${rc}">${r.rank}</span></td><td>${r.team}${badge}</td><td>${r.p}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td><td style="${gdCol}">${gd}</td><td><span class="pts">${r.pts}</span></td></tr>`;
  });
  html+=`</tbody></table></div>`;
  document.getElementById('standings-area').innerHTML=html;
}

// ══ 試合生成 ══
function genMatches(teams){
  const t=[...teams];
  if(t.length%2)t.push(null);
  const N=t.length,fixed=t[0],rot=t.slice(1);
  const result=[];let id=0;
  for(let r=0;r<N-1;r++){
    const rotated=r?[...rot.slice(-r),...rot.slice(0,-r)]:[...rot];
    const circle=[fixed,...rotated];
    for(let i=0;i<N/2;i++){
      const h=circle[i],a=circle[N-1-i];
      if(h&&a){
        result.push({id:id++,round:r+1,leg:1,home:h,away:a,home_score:null,away_score:null,played:false});
        result.push({id:id++,round:r+1,leg:2,home:a,away:h,home_score:null,away_score:null,played:false});
      }
    }
  }
  result.sort((a,b)=>a.leg-b.leg||a.round-b.round);
  result.forEach((m,i)=>m.id=i);
  return result;
}

// ══ 試合入力 ══
function loadMatches(){
  const yr = document.getElementById('m-yr').value;
  const div = curDiv.matches;
  if(!yr){ document.getElementById('matches-area').innerHTML='<div class="loading">データなし</div>'; return; }
  const d = getDivData(yr, div);
  const matches = d?.matches||[];
  allMatches[div] = matches;
  // 節フィルタ更新
  const rounds=[...new Set(matches.map(m=>`${m.leg}-${m.round}`))].sort((a,b)=>{
    const[al,ar]=a.split('-').map(Number),[bl,br]=b.split('-').map(Number);return al-bl||ar-br;
  });
  const sel=document.getElementById('m-round');
  sel.innerHTML='<option value="all">全節</option>'+rounds.map(k=>{const[l,r]=k.split('-');return`<option value="${k}">${l}回戦 第${r}節</option>`;}).join('');
  renderMatches();
}

function renderMatches(){
  const div=curDiv.matches;
  const yr=document.getElementById('m-yr').value;
  const data=allMatches[div]||[];
  const rv=document.getElementById('m-round').value;
  const sv=document.getElementById('m-status').value;
  let filtered=[...data];
  if(rv!=='all'){const[l,r]=rv.split('-').map(Number);filtered=filtered.filter(m=>m.leg===l&&m.round===r);}
  if(sv==='pending')filtered=filtered.filter(m=>!m.played);
  if(sv==='done')filtered=filtered.filter(m=>m.played);
  const groups={};
  filtered.forEach(m=>{const k=`${m.leg}-${m.round}`;(groups[k]=groups[k]||[]).push(m);});
  const keys=Object.keys(groups).sort((a,b)=>{const[al,ar]=a.split('-').map(Number),[bl,br]=b.split('-').map(Number);return al-bl||ar-br;});
  if(!keys.length){document.getElementById('matches-area').innerHTML='<div class="loading">該当なし</div>';return;}
  let html='';
  keys.forEach(k=>{
    const[l,r]=k.split('-');
    html+=`<div class="rlbl">${l}回戦　第${r}節</div><div class="card" style="margin-top:0;border-radius:0 0 10px 10px;">`;
    groups[k].forEach(m=>{
      const hs=m.home_score!==null?m.home_score:'',as_=m.away_score!==null?m.away_score:'';
      html+=`<div class="mcard"><div class="mteam home">${m.home}</div>
        <div class="mcenter">
          <div class="srow">
            <input class="sinp" type="number" min="0" max="99" value="${hs}" placeholder="-" id="hs-${div}-${m.id}">
            <span class="ssep">:</span>
            <input class="sinp" type="number" min="0" max="99" value="${as_}" placeholder="-" id="as-${div}-${m.id}">
          </div>
          <button class="sbtn ${m.played?'saved':''}" id="sb-${div}-${m.id}" onclick="saveMatch('${yr}',${div},${m.id})">
            ${m.played?'✓ 保存済':'保存'}
          </button>
        </div>
        <div class="mteam">${m.away}</div>
      </div>`;
    });
    html+=`</div>`;
  });
  document.getElementById('matches-area').innerHTML=html;
}

function saveMatch(yr,div,id){
  const hs=parseInt(document.getElementById(`hs-${div}-${id}`).value);
  const as_=parseInt(document.getElementById(`as-${div}-${id}`).value);
  if(isNaN(hs)||isNaN(as_)||hs<0||as_<0){alert('スコアを正しく入力してください');return;}
  const m=getDivData(yr,div)?.matches?.find(x=>x.id===id);
  if(!m)return;
  m.home_score=hs;m.away_score=as_;m.played=true;
  save(db);
  const btn=document.getElementById(`sb-${div}-${id}`);
  if(btn){btn.textContent='✓ 保存済';btn.classList.add('saved');}
  allMatches[div]=[...(getDivData(yr,div)?.matches||[])];
}

function showH2H(){
  const a=document.getElementById('h2h-a').value;
  const b=document.getElementById('h2h-b').value;
  if(!a||!b||a===b){alert('異なるチームを選択してください');return;}
  let wA=0,wB=0,draws=0,gfA=0,gfB=0;const hist=[];
  Object.entries(db.seasons).sort((x,y)=>y[0]-x[0]).forEach(([yr,s])=>{
    Object.entries(s.divisions||{}).forEach(([dv,d])=>{
      (d.matches||[]).forEach(m=>{
        if(!m.played)return;
        if(!({[m.home]:1,[m.away]:1}[a]&&{[m.home]:1,[m.away]:1}[b]))return;
        const aH=m.home===a,ag=aH?m.home_score:m.away_score,bg=aH?m.away_score:m.home_score;
        gfA+=ag;gfB+=bg;
        const res=ag>bg?'W':ag<bg?'L':'D';
        if(res==='W')wA++;else if(res==='L')wB++;else draws++;
        hist.push({yr,div:+dv,leg:m.leg,round:m.round,home:m.home,away:m.away,hs:m.home_score,as_:m.away_score,res});
      });
    });
  });
  let html=`<div class="card"><div class="h2h-sum">
    <div><div class="h2h-val" style="color:var(--g)">${wA}</div><div class="h2h-lbl">${a} 勝</div></div>
    <div><div class="h2h-val" style="color:var(--gold)">${draws}</div><div class="h2h-lbl">引き分け</div></div>
    <div><div class="h2h-val" style="color:var(--red)">${wB}</div><div class="h2h-lbl">${b} 勝</div></div>
  </div>
  <div style="text-align:center;font-size:12px;color:var(--muted);padding:0 13px 12px;">通算 ${gfA}得点/${gfB}失点（${a}視点） | ${hist.length}試合</div></div>`;
  if(hist.length){
    html+=`<div class="slbl">対戦履歴</div><div class="card">`;
    hist.forEach(h=>{
      const rc=h.res==='W'?'var(--g)':h.res==='L'?'var(--red)':'var(--gold)';
      html+=`<div style="display:flex;align-items:center;padding:9px 13px;border-bottom:1px solid #f0f2f5;gap:8px;">
        <div style="font-size:11px;color:var(--muted);flex:0 0 auto;">${h.yr}年<br>${getDivName(h.div)}</div>
        <div style="flex:1;text-align:center;font-size:13px;font-weight:700;">${h.home} ${h.hs}−${h.as_} ${h.away}</div>
        <div style="font-size:15px;font-weight:700;color:${rc};flex:0 0 auto;">${h.res}</div>
      </div>`;
    });
    html+=`</div>`;
  }
  document.getElementById('h2h-area').innerHTML=html;
}

function execPromo(){
  const fy=parseInt(document.getElementById('p-from').value);
  const ty=parseInt(document.getElementById('p-to').value);
  if(!fy||!ty){alert('シーズンを選択してください');return;}
  const pn={1:0,2:+document.getElementById('pn2').value,3:+document.getElementById('pn3').value};
  const rn={1:+document.getElementById('rn1').value,2:+document.getElementById('rn2').value,3:0};
  if(!confirm(`${fy}年 → ${ty}年 へ昇降格を実行しますか？`))return;
  const log=[];
  [1,2,3].forEach(div=>{
    const rows=calcStandings(fy,div);
    const thisPn=div>1?pn[div]:0,thisRn=div<3?rn[div]:0;
    if(div>1&&thisPn>0) rows.slice(0,thisPn).forEach(r=>{
      if(db.teams[r.team]){db.teams[r.team].div=div-1;log.push(`↑ ${r.team}: ${div}部→${div-1}部`);}
    });
    if(div<3&&thisRn>0) rows.slice(-thisRn).forEach(r=>{
      if(db.teams[r.team]){db.teams[r.team].div=div+1;log.push(`↓ ${r.team}: ${div}部→${div+1}部`);}
    });
  });
  save(db);
  alert(log.join('\n')||'変更なし');
  renderPromoPreview();
}

function toggleTrend(t,el,c){
  trendSel.has(t)?trendSel.delete(t):trendSel.add(t);
  el.classList.toggle('on');
  if(trendSel.has(t)){el.style.background=c;el.style.color='#fff';el.style.borderColor='transparent';}
  else{el.style.background='';el.style.color=c;el.style.borderColor=c;}
  const seasons=getSeasons().sort((a,b)=>a-b);
  const div=1;const teamRanks={};const allTeams=[];
  seasons.forEach(yr=>calcStandings(parseInt(yr),div).forEach(r=>{if(!teamRanks[r.team]){teamRanks[r.team]={};allTeams.push(r.team);}teamRanks[r.team][yr]=r.rank;}));
  drawTrend(seasons,allTeams,teamRanks);
}

function drawTrend(seasons,allTeams,teamRanks){
  const cv=document.getElementById('trend-cv');if(!cv)return;
  const W=cv.offsetWidth||300;cv.width=W;cv.height=220;
  const ctx=cv.getContext('2d');ctx.clearRect(0,0,W,220);
  const pl=40,pr=80,pt=14,pb=30,gw=W-pl-pr,gh=220-pt-pb;
  const n=seasons.length;
  const maxR=Math.max(...allTeams.flatMap(t=>Object.values(teamRanks[t]||{})),4);
  const xs=i=>pl+gw*i/Math.max(n-1,1);
  const ys=r=>pt+gh*(r-1)/Math.max(maxR-1,1);
  ctx.strokeStyle='#eee';ctx.lineWidth=1;
  for(let r=1;r<=maxR;r++){ctx.beginPath();ctx.moveTo(pl,ys(r));ctx.lineTo(W-pr,ys(r));ctx.stroke();ctx.fillStyle='#aaa';ctx.font='10px sans-serif';ctx.textAlign='right';ctx.fillText(r+'位',pl-4,ys(r)+4);}
  seasons.forEach((yr,i)=>{ctx.fillStyle='#aaa';ctx.font='10px sans-serif';ctx.textAlign='center';ctx.fillText(yr,xs(i),220-pb+12);});
  allTeams.forEach((t,ti)=>{
    if(!trendSel.has(t))return;
    const c=PAL[ti%PAL.length];
    const pts=seasons.map((yr,i)=>teamRanks[t]?.[yr]!=null?{x:xs(i),y:ys(teamRanks[t][yr]),r:teamRanks[t][yr]}:null);
    const valid=pts.filter(Boolean);
    if(valid.length>=2){ctx.beginPath();ctx.strokeStyle=c;ctx.lineWidth=2;ctx.moveTo(valid[0].x,valid[0].y);valid.slice(1).forEach(p=>ctx.lineTo(p.x,p.y));ctx.stroke();}
    valid.forEach(p=>{ctx.beginPath();ctx.fillStyle=c;ctx.arc(p.x,p.y,4,0,Math.PI*2);ctx.fill();});
    if(valid.length){const last=valid[valid.length-1];ctx.fillStyle=c;ctx.font='bold 10px sans-serif';ctx.textAlign='left';ctx.fillText(t,last.x+7,last.y+4);}
  });
}

  const div=parseInt(document.getElementById('is-div')?.value||1);
  const d=getDivData(yr,div);
  const matches=d?.matches||[];
  const played=matches.filter(m=>m.played);
  const allTeams=sorted([...new Set([...matches.map(m=>m.home),...matches.map(m=>m.away)])]);
  if(!played.length){document.getElementById('is-content').innerHTML='<div class="loading">試合結果がありません</div>';return;}
  if(!isSel.size)isSel=new Set(allTeams);
  const rl=sorted([...new Set(played.map(m=>`${m.leg}-${m.round}`))]);
  const snaps=rl.map(k=>{
    const[l,r]=k.split('-').map(Number);
    const sub=played.filter(m=>(m.leg<l)||(m.leg===l&&m.round<=r));
    const s={};allTeams.forEach(t=>s[t]={team:t,p:0,w:0,d:0,l:0,gf:0,ga:0,gd:0,pts:0});
    sub.forEach(m=>{const h=m.home,a=m.away,hs=m.home_score,as_=m.away_score;
      s[h].p++;s[a].p++;s[h].gf+=hs;s[h].ga+=as_;s[a].gf+=as_;s[a].ga+=hs;s[h].gd=s[h].gf-s[h].ga;s[a].gd=s[a].gf-s[a].ga;
      if(hs>as_){s[h].pts+=3;s[h].w++;s[a].l++;}else if(hs<as_){s[a].pts+=3;s[a].w++;s[h].l++;}else{s[h].pts++;s[a].pts++;s[h].d++;s[a].d++;}
    });
    const ranked=Object.values(s).sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf);
    ranked.forEach((r,i)=>r.rank=i+1);
    return{leg:l,round:r,ranks:Object.fromEntries(ranked.map(r=>[r.team,r.rank]))};
  });
  let html=`<div class="tfilter">`;
  allTeams.forEach((t,i)=>{
    const c=PAL[i%PAL.length],on=isSel.has(t);
    html+=`<button class="tchip ${on?'on':''}" style="${on?`background:${c};`:`color:${c};border-color:${c};`}"
      onclick="toggleIs('${t.replace(/'/g,"\\'")}',this,'${c}')">${t}</button>`;
  });
  html+=`</div><div class="card chart-wrap"><canvas id="is-cv" height="220"></canvas></div>`;
  document.getElementById('is-content').innerHTML=html;
  setTimeout(()=>drawIsChart(snaps,allTeams),50);
}

function toggleIs(t,el,c){
  isSel.has(t)?isSel.delete(t):isSel.add(t);
  el.classList.toggle('on');
  if(isSel.has(t)){el.style.background=c;el.style.color='#fff';el.style.borderColor='transparent';}
  else{el.style.background='';el.style.color=c;el.style.borderColor=c;}
  const yr=parseInt(document.getElementById('is-yr')?.value);
  const div=parseInt(document.getElementById('is-div')?.value||1);
  const d=getDivData(yr,div);
  const matches=d?.matches||[];
  const played=matches.filter(m=>m.played);
  const allTeams=sorted([...new Set([...matches.map(m=>m.home),...matches.map(m=>m.away)])]);
  const rl=sorted([...new Set(played.map(m=>`${m.leg}-${m.round}`))]);
  const snaps=rl.map(k=>{
    const[l,r]=k.split('-').map(Number);
    const sub=played.filter(m=>(m.leg<l)||(m.leg===l&&m.round<=r));
    const s={};allTeams.forEach(t=>s[t]={pts:0,gd:0,gf:0});
    sub.forEach(m=>{const h=m.home,a=m.away,hs=m.home_score,as_=m.away_score;
      s[h].gf+=hs;s[h].gd+=hs-as_;s[a].gf+=as_;s[a].gd+=as_-hs;
      if(hs>as_)s[h].pts+=3;else if(hs<as_)s[a].pts+=3;else{s[h].pts++;s[a].pts++;}
    });
    const ranked=allTeams.slice().sort((a,b)=>s[b].pts-s[a].pts||s[b].gd-s[a].gd||s[b].gf-s[a].gf);
    return{leg:l,round:r,ranks:Object.fromEntries(ranked.map((t,i)=>[t,i+1]))};
  });
  drawIsChart(snaps,allTeams);
}

function drawIsChart(snaps,allTeams){
  const cv=document.getElementById('is-cv');if(!cv)return;
  const W=cv.offsetWidth||300;cv.width=W;cv.height=220;
  const ctx=cv.getContext('2d');ctx.clearRect(0,0,W,220);
  const pl=40,pr=80,pt=14,pb=30,gw=W-pl-pr,gh=220-pt-pb;
  const n=snaps.length,nt=allTeams.length;
  const xs=i=>pl+gw*i/Math.max(n-1,1);
  const ys=r=>pt+gh*(r-1)/Math.max(nt-1,1);
  ctx.strokeStyle='#eee';ctx.lineWidth=1;
  for(let r=1;r<=nt;r++){ctx.beginPath();ctx.moveTo(pl,ys(r));ctx.lineTo(W-pr,ys(r));ctx.stroke();ctx.fillStyle='#aaa';ctx.font='10px sans-serif';ctx.textAlign='right';ctx.fillText(r+'位',pl-4,ys(r)+4);}
  snaps.forEach((s,i)=>{ctx.fillStyle='#aaa';ctx.font='9px sans-serif';ctx.textAlign='center';ctx.fillText(`${s.leg}-${s.round}`,xs(i),220-pb+10);});
  allTeams.forEach((t,ti)=>{
    if(!isSel.has(t))return;
    const c=PAL[ti%PAL.length];
    const pts=snaps.map((s,i)=>s.ranks[t]!=null?{x:xs(i),y:ys(s.ranks[t])}:null).filter(Boolean);
    if(pts.length>=2){ctx.beginPath();ctx.strokeStyle=c;ctx.lineWidth=2;ctx.moveTo(pts[0].x,pts[0].y);pts.slice(1).forEach(p=>ctx.lineTo(p.x,p.y));ctx.stroke();}
    pts.forEach(p=>{ctx.beginPath();ctx.fillStyle=c;ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill();});
    if(pts.length){const last=pts[pts.length-1];ctx.fillStyle=c;ctx.font='bold 10px sans-serif';ctx.textAlign='left';ctx.fillText(t,last.x+6,last.y+4);}
  });
}

// ══ 昇格PO ══
function renderPlayoff(){
  const yr=document.getElementById('po-yr').value;
  const div=curDiv.po;
  if(!yr){document.getElementById('playoff-area').innerHTML='<div class="loading">年度なし</div>';return;}
  const d=getDivData(yr,div);
  if(!d||!d.started){document.getElementById('playoff-area').innerHTML='<div class="loading">未開始</div>';return;}
  const po=d.playoff||{enabled:false,playoffN:2,matches:[],winner:null};
  const rows=calcStandings(parseInt(yr),div);
  const pN=d.promoteN||1;
  let html=`<div class="card"><div class="card-body">
    <label style="display:flex;align-items:center;gap:8px;cursor:pointer;margin-bottom:10px;">
      <input type="checkbox" ${po.enabled?'checked':''} onchange="togglePO('${yr}',${div},this.checked)" style="width:16px;height:16px;accent-color:var(--g);">
      <span style="font-size:13px;">プレーオフを有効にする</span>
    </label>
    <div style="font-size:12px;color:var(--muted);">
      自動昇格：上位${pN}チーム<br>
      PO参加：${pN+1}位〜${pN+(po.playoffN||2)}位
      ${rows.slice(pN,pN+(po.playoffN||2)).map(r=>`<strong>${r.team}</strong>`).join('、')}
    </div>
    <div style="display:flex;align-items:center;gap:8px;margin-top:10px;">
      <span style="font-size:12px;color:var(--muted);">PO対象：</span>
      <input type="number" min="2" max="8" value="${po.playoffN||2}" style="width:60px;padding:5px 8px;"
        onchange="updatePON('${yr}',${div},+this.value)">
      <span style="font-size:12px;color:var(--muted);">チーム</span>
    </div>
  </div></div>`;

  if(po.enabled){
    const poTeams=rows.slice(pN,pN+(po.playoffN||2));
    if(po.matches.length===0&&poTeams.length>=2){
      initPOMatches(yr,div,poTeams.map(r=>r.team));
      return renderPlayoff();
    }
    html+=`<div class="slbl">トーナメント</div>`;
    const rounds=[...new Set(po.matches.map(m=>m.round))].sort((a,b)=>a-b);
    rounds.forEach(rnd=>{
      const rms=po.matches.filter(m=>m.round===rnd);
      const rName=rnd===Math.max(...rounds)?'決勝':rnd===Math.max(...rounds)-1?'準決勝':`第${rnd}ラウンド`;
      html+=`<div class="slbl">${rName}</div>`;
      rms.forEach(m=>{
        const aW=m.played&&m.scoreA>m.scoreB,bW=m.played&&m.scoreB>m.scoreA;
        html+=`<div class="card"><div class="po-match">
          <div class="po-team ${aW?'winner':m.played?'loser':''}">
            <span>${m.teamA||'未定'}</span>
            ${m.teamA?`<input class="po-sinp" type="number" min="0" max="99" value="${m.scoreA!==null?m.scoreA:''}" placeholder="-" id="psa-${m.id}" onchange="savePO('${yr}',${div},${m.id})">`:''}
          </div>
          <div class="po-team ${bW?'winner':m.played?'loser':''}">
            <span>${m.teamB||'未定'}</span>
            ${m.teamB?`<input class="po-sinp" type="number" min="0" max="99" value="${m.scoreB!==null?m.scoreB:''}" placeholder="-" id="psb-${m.id}" onchange="savePO('${yr}',${div},${m.id})">`:''}
          </div>
        </div></div>`;
      });
    });
    if(po.winner){
      html+=`<div class="card" style="text-align:center;padding:20px;background:var(--g2);border-color:var(--g);">
        <div style="font-size:24px;">🏆</div>
        <div style="font-size:16px;font-weight:700;color:var(--g);margin-top:6px;">昇格PO優勝</div>
        <div style="font-size:18px;font-weight:700;margin-top:4px;">${po.winner}</div>
      </div>`;
    }
  }
  document.getElementById('playoff-area').innerHTML=html;
}

function togglePO(yr,div,enabled){
  const d=getDivData(yr,div);if(!d)return;
  if(!d.playoff)d.playoff={enabled:false,playoffN:2,matches:[],winner:null};
  d.playoff.enabled=enabled;save(db);renderPlayoff();
}

function updatePON(yr,div,n){
  const d=getDivData(yr,div);if(!d)return;
  d.playoff.playoffN=n;d.playoff.matches=[];d.playoff.winner=null;save(db);renderPlayoff();
}

function initPOMatches(yr,div,teams){
  const d=getDivData(yr,div);if(!d)return;
  const n=teams.length,slots=Math.pow(2,Math.ceil(Math.log2(n)));
  const padded=[...teams,...Array(slots-n).fill(null)];
  const ms=[];let id=0;
  for(let i=0;i<slots/2;i++) ms.push({id:id++,round:1,teamA:padded[i],teamB:padded[slots-1-i],scoreA:null,scoreB:null,played:false});
  let prev=slots/2,rnd=2;
  while(prev>1){for(let i=0;i<prev/2;i++)ms.push({id:id++,round:rnd,teamA:null,teamB:null,scoreA:null,scoreB:null,played:false});prev/=2;rnd++;}
  d.playoff.matches=ms;save(db);
}

function savePO(yr,div,id){
  const sa=parseInt(document.getElementById(`psa-${id}`)?.value);
  const sb=parseInt(document.getElementById(`psb-${id}`)?.value);
  if(isNaN(sa)||isNaN(sb))return;
  if(sa===sb){alert('POは引き分けなし');return;}
  const d=getDivData(yr,div);if(!d)return;
  const m=d.playoff.matches.find(x=>x.id===id);if(!m)return;
  m.scoreA=sa;m.scoreB=sb;m.played=true;
  const winner=sa>sb?m.teamA:m.teamB;
  const myIdx=d.playoff.matches.filter(x=>x.round===m.round).indexOf(m);
  const nextMs=d.playoff.matches.filter(x=>x.round===m.round+1);
  const nxt=nextMs[Math.floor(myIdx/2)];
  if(nxt){if(myIdx%2===0)nxt.teamA=winner;else nxt.teamB=winner;}
  else d.playoff.winner=winner;
  save(db);renderPlayoff();
}

// ══ 過去データ読み込み・書き出し ══
function importPastData(){
  const raw = document.getElementById('import-json').value.trim();
  const msg = document.getElementById('import-msg');
  if(!raw){ msg.style.color='var(--red)'; msg.textContent='JSONを入力してください'; return; }
  let data;
  try{ data = JSON.parse(raw); }
  catch(e){ msg.style.color='var(--red)'; msg.textContent='JSONの形式が正しくありません'; return; }
  if(!Array.isArray(data)){ msg.style.color='var(--red)'; msg.textContent='配列形式で入力してください'; return; }

  let added = 0;
  data.forEach(entry=>{
    const yr = String(entry.year);
    const div = String(entry.div);
    if(!yr||!div||!entry.standings) return;
    // seasons に年度がなければ作成
    db.seasons[yr] = db.seasons[yr] || {divisions:{}};
    db.seasons[yr].divisions = db.seasons[yr].divisions || {};
    // 既存データがあれば past_standings だけ更新、なければ past のみのエントリを作成
    if(!db.seasons[yr].divisions[div]){
      db.seasons[yr].divisions[div] = {
        teams: entry.standings.map(s=>s.team),
        matches: [],
        started: false,
        promoteN: 1,
        relegateN: 1,
        playoff: {enabled:false,playoffN:2,matches:[],winner:null},
        past_standings: entry.standings  // 順位のみ保存
      };
    } else {
      db.seasons[yr].divisions[div].past_standings = entry.standings;
    }
    // teamsにも登録（未登録のみ）
    entry.standings.forEach(s=>{
      if(s.team && !db.teams[s.team]){
        db.teams[s.team] = {div: parseInt(div), active: true};
      }
    });
    added++;
  });

  save(db);
  refreshSeasonSelects();
  document.getElementById('import-json').value='';
  msg.style.color='var(--g)';
  msg.textContent=`✓ ${added}件のシーズンデータを読み込みました`;
  setTimeout(()=>msg.textContent='', 3000);
}

function exportCurrentData(){
  // 現在のDBをコピー用にエクスポート
  const json = JSON.stringify(db, null, 2);
  // テキストエリアに表示
  const ta = document.getElementById('import-json');
  ta.value = json;
  ta.select();
  const msg = document.getElementById('import-msg');
  msg.style.color='var(--muted)';
  msg.textContent='↑ 上のテキストをコピーしてバックアップできます';
}

// ══ ユーティリティ ══
function sorted(arr){ return [...arr].sort(); }

// 順位取得（past_standings優先、なければcalcStandings）
function getStandings(yr, div){
  const d = getDivData(yr, div);
  if(!d) return [];
  // past_standings があればそちらを使う
  if(d.past_standings && d.past_standings.length){
    return d.past_standings.map((s,i)=>({...s, rank: s.rank||i+1, pts: s.pts||null}));
  }
  return calcStandings(parseInt(yr), div);
}
